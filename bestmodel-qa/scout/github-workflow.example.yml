# Example only — copy to carl0sfelipe/bestmodel as .github/workflows/asr-scout.yml.
# Not active in this repo on purpose.
name: asr-scout
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scout Hugging Face for ASR candidates
        run: python3 tools/scout/asr_scout.py --days 2 --out data/scout/asr-candidates.json --md data/scout/asr-candidates.md
      - name: Open one issue per new candidate (benchmark request)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          python3 - <<'PY'
          import json, subprocess
          rows = json.load(open("data/scout/asr-candidates.json"))["candidates"]
          for r in [r for r in rows if r["is_new"]][:5]:
              title = f"bench-request: {r['model']} on asr-stream-dictation-v1"
              exists = subprocess.run(["gh", "issue", "list", "--search", title, "--json", "number"],
                                      capture_output=True, text=True).stdout.strip()
              if exists in ("", "[]"):
                  subprocess.run(["gh", "issue", "create", "--title", title, "--label", "bench-request",
                                  "--body", f"Scout score {r['score']}: {'; '.join(r['why'])}\n\nBasis: no data yet."])
          PY
      - name: Commit snapshot
        run: |
          git config user.name "asr-scout"; git config user.email "scout@bestmodel.run"
          git add data/scout && git commit -m "chore(scout): asr candidates $(date -u +%F)" || exit 0
          git push
